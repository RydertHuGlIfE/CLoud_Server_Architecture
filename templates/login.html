<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    form {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      width: 300px;
      gap: 15px;
    }

    input,
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: white;
      color: black;
    }

    button {
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      color: #ff4c4c;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <form action="{{ url_for('login') }}" method="POST">

    <h2>🔐 Login</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <input
      type="text"
      name="username"
      placeholder="Username"
      required
      autocomplete="username"
    />

    <input
      type="password"
      name="password"
      placeholder="Password"
      required
      autocomplete="current-password"
    />

    <button type="submit">Login</button>

  </form>

</body>
</html>
